[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ypso-keys"
version = "0.2.0"
description = "Repeatable, local YpsoPump session recovery from a rooted donor phone"
requires-python = ">=3.11"
dependencies = ["frida==17.17.0"]

[project.scripts]
ypso-keys = "ypso_keys.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ypso_keys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
